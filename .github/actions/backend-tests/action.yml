name: Run backend test suite
description: >
  Installs backend dependencies, applies migrations, and runs the pytest suite.
  Assumes the calling job has already started `postgres` and `redis` services
  reachable at localhost, and provided the env vars pytest-django needs
  (SECRET_KEY, DEBUG, WEBHOOK_SECRET, POSTGRES_*, REDIS_URL, CELERY_*).

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      shell: bash
      working-directory: backend
      # No --no-cache-dir here: actions/setup-python's cache: pip step above needs
      # pip's own cache dir populated to have something to save.
      run: pip install -r requirements.txt

    - name: Django system check
      shell: bash
      working-directory: backend
      run: python manage.py check

    - name: Apply migrations
      shell: bash
      working-directory: backend
      run: python manage.py migrate --noinput

    - name: Link test suite into backend/
      shell: bash
      # test_backend/ lives at the repo root and is only visible at backend/test_backend
      # locally because docker-compose.yml bind-mounts it there. A plain checkout has no
      # backend/test_backend, so pytest.ini's `testpaths = test_backend` would find nothing.
      run: ln -s ../test_backend backend/test_backend

    - name: Run pytest
      shell: bash
      working-directory: backend
      run: pytest -v
