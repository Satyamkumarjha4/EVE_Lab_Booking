services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eve}
      POSTGRES_USER: ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on localhost only: Docker's port publishing bypasses host firewalls, and these
    # dev credentials / the password-less Redis must not be reachable from the network.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eve} -d ${POSTGRES_DB:-eve}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    # Redis is also the Celery broker: anyone who can reach it could enqueue webhook-delivery
    # tasks, which the worker would sign with the real secret. Keep it off the network.
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      INTERNAL_BASE_URL: http://web:8000
    # Lowercase `z` = SELinux label shared by every container mounting this dir. Uppercase `Z`
    # makes it private to one container, so web and celery-worker would lock each other out.
    volumes:
      - ./backend:/app:z
      - ./test_backend:/app/test_backend:z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      INTERNAL_BASE_URL: http://web:8000
    volumes:
      - ./backend:/app:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A eve worker -l info

  # Fires the periodic lifecycle sweeps (expire unpaid bookings, mark no-shows) onto the worker.
  # The schedule file lives in /tmp so it isn't written into the mounted source tree.
  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app:z
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A eve beat -l info --schedule /tmp/celerybeat-schedule

volumes:
  postgres_data:
